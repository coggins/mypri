name: MyPriMobile
options:
  bundleIdPrefix: com.coggins
  deploymentTarget:
    iOS: "16.0"
packages:
  MyPriKit:
    path: ../
targets:
  MyPriMobile:
    type: application
    platform: iOS
    sources:
      - path: MyPriMobile
    dependencies:
      - package: MyPriKit
        product: MyPriKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coggins.mypri.mobile
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 7Y3P55BY65
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MyPri
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
